<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10233f"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d62728"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
  </defs>

  <rect width="500" height="500" fill="#ffffff"/>

  <!-- axes (1 unit = 90 px, origin at 250,250) -->
  <g stroke="#c8ced8" stroke-width="1.5">
    <line x1="30" y1="250" x2="470" y2="250"/>
    <line x1="250" y1="30" x2="250" y2="455"/>
  </g>

  <!-- eigen directions: v1 at 30 degrees, v2 at 120 degrees -->
  <g stroke="#9aa4b2" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="59.5" y1="360" x2="440.5" y2="140"/>
    <line x1="350" y1="423.2" x2="140" y2="59.5"/>
  </g>

  <!-- unit circle and its image: ellipse with semi-axes lambda1 = 2 and lambda2 = 1/2 along the eigen directions -->
  <circle cx="250" cy="250" r="90" fill="#f28e2b" fill-opacity="0.08" stroke="#f28e2b" stroke-width="3"/>
  <ellipse cx="250" cy="250" rx="180" ry="45" transform="rotate(-30 250 250)" fill="#4e79a7" fill-opacity="0.08" stroke="#4e79a7" stroke-width="3"/>

  <!-- eigenvectors and their images -->
  <line x1="250" y1="250" x2="405.9" y2="160" stroke="#d62728" stroke-width="5" marker-end="url(#arrow-red)"/>
  <line x1="250" y1="250" x2="327.9" y2="205" stroke="#10233f" stroke-width="2.5" marker-end="url(#arrow-black)"/>
  <line x1="250" y1="250" x2="205" y2="172.1" stroke="#10233f" stroke-width="2.5" marker-end="url(#arrow-black)"/>
  <line x1="250" y1="250" x2="227.5" y2="211" stroke="#1f5fbf" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <circle cx="250" cy="250" r="3.5" fill="#10233f"/>

  <!-- labels -->
  <g font-size="20">
    <text x="312" y="232" fill="#10233f" font-weight="bold">v<tspan font-size="14" dy="5">1</tspan></text>
    <text x="392" y="140" fill="#d62728">L<tspan font-weight="bold">v</tspan><tspan font-size="14" dy="5">1</tspan><tspan dy="-5"> = 2</tspan><tspan font-weight="bold">v</tspan><tspan font-size="14" dy="5">1</tspan></text>
    <text x="176" y="164" fill="#10233f" font-weight="bold">v<tspan font-size="14" dy="5">2</tspan></text>
    <text x="96" y="214" fill="#1f5fbf">L<tspan font-weight="bold">v</tspan><tspan font-size="14" dy="5">2</tspan><tspan dy="-5"> = ½</tspan><tspan font-weight="bold">v</tspan><tspan font-size="14" dy="5">2</tspan></text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#10233f">
    <line x1="30" y1="40" x2="55" y2="40" stroke="#f28e2b" stroke-width="3"/>
    <text x="63" y="45">unit circle</text>
    <line x1="30" y1="64" x2="55" y2="64" stroke="#4e79a7" stroke-width="3"/>
    <text x="63" y="69">image under L</text>
  </g>

  <text x="250" y="476" font-size="15" fill="#4a5568" text-anchor="middle">The circle is mapped to an ellipse whose axes lie</text>
  <text x="250" y="494" font-size="15" fill="#4a5568" text-anchor="middle">along the eigen directions, with semi-axes |λ<tspan font-size="11" dy="3">1</tspan><tspan dy="-3">| and |λ</tspan><tspan font-size="11" dy="3">2</tspan><tspan dy="-3">|</tspan></text>
</svg>
